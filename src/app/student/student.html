@for (student of students; track $index)
{
    <!--
    <p 
        [ngStyle] = "{'backgroundColor': student.gender == 'F' ? FEMALE_COLOR : MALE_COLOR}"
        [ngClass]="{'absent' : !student.isPresent}" 
    > -->

    <p [ngStyle]="getStyle(student)">
        {{$index + 1}}) {{student.name}} di {{student.city}} è
        @if(student.isPresent)
        {
            presente
        }
        @else
        {
            <span style="text-transform: uppercase;">assente</span>
        }
        
    </p>
}
